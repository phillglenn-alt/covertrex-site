<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://static.cloudflareinsights.com; img-src 'self' data:; connect-src https://a.klaviyo.com https://cloudflareinsights.com; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Covertrex</title>
<meta name="description" content="Covertrex. See more. Say less.">
<style>
  :root {
    --white: #ffffff;
    /* Neon halo colour. Change these two to retint the pulse. */
    --neon: 190, 235, 255;
    --neon-deep: 90, 190, 255;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--white); }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(4vh, env(safe-area-inset-top)) 16px max(5vh, env(safe-area-inset-bottom));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 4vh;
  }
  .crest-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .crest {
    width: min(92vw, 118vh);
    max-height: 70vh;
    height: auto;
    overflow: visible;
    fill: var(--white);
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
  .wordmark { width: min(78vw, 420px); height: auto; fill: var(--white); overflow: visible; }
  .tagline {
    font-size: clamp(0.72rem, 1.6vw, 0.9rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    font-weight: 400;
    padding-left: 0.42em; /* balances trailing letter-spacing */
    color: rgba(255,255,255,.82);
  }

  /* Owl eyes blink every 3 seconds */
  .eyes {
    transform-box: fill-box;
    transform-origin: 50% 62%;
    animation: blink 3s infinite;
  }
  @keyframes blink {
    0%, 88%, 100% { transform: scaleY(1); }
    92%           { transform: scaleY(0.08); }
    96%           { transform: scaleY(1); }
  }

  /* Neon pulse lights up the white every 6 seconds */
  .glow { animation: neon 6s infinite; }
  @keyframes neon {
    0%, 30%, 100% {
      filter: drop-shadow(0 0 0 rgba(var(--neon), 0));
    }
    8% {
      filter:
        drop-shadow(0 0 2px rgba(255,255,255,1))
        drop-shadow(0 0 8px rgba(var(--neon), .95))
        drop-shadow(0 0 22px rgba(var(--neon-deep), .85))
        drop-shadow(0 0 48px rgba(var(--neon-deep), .55));
    }
    14% {
      filter:
        drop-shadow(0 0 1px rgba(255,255,255,.9))
        drop-shadow(0 0 5px rgba(var(--neon), .8))
        drop-shadow(0 0 14px rgba(var(--neon-deep), .6))
        drop-shadow(0 0 30px rgba(var(--neon-deep), .3));
    }
  }
  .tagline.glow { animation-name: neon-text; }
  @keyframes neon-text {
    0%, 30%, 100% { text-shadow: none; color: rgba(255,255,255,.82); }
    8%  { color: #fff; text-shadow: 0 0 4px #fff, 0 0 12px rgba(var(--neon), .9), 0 0 26px rgba(var(--neon-deep), .7); }
    14% { color: #fff; text-shadow: 0 0 3px #fff, 0 0 8px rgba(var(--neon), .6), 0 0 18px rgba(var(--neon-deep), .4); }
  }


  /* Sign-up */
  .signup { width: min(92vw, 420px); margin-top: .4rem; }
  .signup-row {
    display: flex;
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 999px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .signup-row:focus-within {
    border-color: #fff;
    box-shadow: 0 0 6px rgba(var(--neon), .8), 0 0 18px rgba(var(--neon-deep), .5);
  }
  .signup input[type=email] {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: #fff; font: inherit; font-size: 16px;
    padding: .8rem 1.1rem;
  }
  .signup input[type=email]::placeholder { color: rgba(255,255,255,.5); }
  .signup button {
    border: 0; cursor: pointer;
    background: #fff; color: #000;
    font: inherit; font-size: .72rem; font-weight: 600;
    letter-spacing: .24em; text-transform: uppercase;
    padding: 0 1.2rem 0 1.4rem;
    border-radius: 999px; margin: 3px;
    transition: box-shadow .2s;
  }
  .signup button:hover, .signup button:focus-visible {
    outline: 0;
    box-shadow: 0 0 6px rgba(var(--neon), 1), 0 0 20px rgba(var(--neon-deep), .8);
  }
  .signup button[disabled] { opacity: .6; cursor: wait; }
  .consent {
    display: flex; gap: .55rem; align-items: flex-start;
    margin-top: .8rem;
    font-size: .7rem; line-height: 1.45; color: rgba(255,255,255,.6);
    text-align: left;
  }
  .consent input { accent-color: #fff; margin-top: .15rem; flex: none; }
  .signup-msg { min-height: 1.2em; margin-top: .6rem; font-size: .78rem; text-align: center; color: rgba(255,255,255,.85); }
  .signup-msg.err { color: #ffb4b4; }
  .signup.done .signup-row, .signup.done .consent { display: none; }
  .signup.done .signup-msg {
    font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px rgba(var(--neon), .9), 0 0 18px rgba(var(--neon-deep), .6);
  }
  .consent a, .legal a { color: rgba(255,255,255,.85); text-decoration: underline; text-underline-offset: 2px; }
  .legal { font-size: .65rem; letter-spacing: .08em; color: rgba(255,255,255,.45); text-align: center; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .brand { gap: 1.1rem; }
  @media (max-height: 700px) { .crest { max-height: 52vh; } }


  /* Logo and tagline glow by default and hand over to the owl:
     when the owl's 6s neon pulse fires, the logo glow switches off; when the owl fades, the logo flicks back on.
     Both start 3s after opening so the page opens on the glowing logo. */
  .crest.glow { animation-delay: 3s; animation-fill-mode: both; }
  .wordmark.logo-glow { animation: logoglow 6s 3s infinite both; }
  @keyframes logoglow {
    0%  { filter: drop-shadow(0 0 2px rgba(255,255,255,1)) drop-shadow(0 0 8px rgba(var(--neon), .95)) drop-shadow(0 0 22px rgba(var(--neon-deep), .85)) drop-shadow(0 0 48px rgba(var(--neon-deep), .55)); }
    2%, 30% { filter: drop-shadow(0 0 0 rgba(var(--neon), 0)); }
    31% { filter: drop-shadow(0 0 2px rgba(255,255,255,1)) drop-shadow(0 0 8px rgba(var(--neon), .95)) drop-shadow(0 0 22px rgba(var(--neon-deep), .85)) drop-shadow(0 0 48px rgba(var(--neon-deep), .55)); }
    32% { filter: drop-shadow(0 0 0 rgba(var(--neon), 0)); }
    34%, 100% { filter: drop-shadow(0 0 2px rgba(255,255,255,1)) drop-shadow(0 0 8px rgba(var(--neon), .95)) drop-shadow(0 0 22px rgba(var(--neon-deep), .85)) drop-shadow(0 0 48px rgba(var(--neon-deep), .55)); }
  }
  .tagline.logo-text { animation: logotext 6s 3s infinite both; }
  @keyframes logotext {
    0%  { color: #fff; text-shadow: 0 0 4px #fff, 0 0 12px rgba(var(--neon), .9), 0 0 26px rgba(var(--neon-deep), .7); }
    2%, 30% { color: rgba(255,255,255,.82); text-shadow: none; }
    31% { color: #fff; text-shadow: 0 0 4px #fff, 0 0 12px rgba(var(--neon), .9), 0 0 26px rgba(var(--neon-deep), .7); }
    32% { color: rgba(255,255,255,.82); text-shadow: none; }
    34%, 100% { color: #fff; text-shadow: 0 0 4px #fff, 0 0 12px rgba(var(--neon), .9), 0 0 26px rgba(var(--neon-deep), .7); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyes, .glow, .logo-glow, .logo-text { animation: none; }
    .crest, .wordmark { filter: drop-shadow(0 0 6px rgba(var(--neon), .45)); }
  }
  @media (max-aspect-ratio: 3/4) {
    .crest { width: 96vw; }
  }
</style>
</head>
<body>

    <p class="tagline logo-text">See more. Say less.</p>
    <form class="signup" id="signup" novalidate>
      <label class="sr" for="email">Email address</label>
      <div class="signup-row">
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Your email" required>
        <button type="submit">Sign up</button>
      </div>
      <div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <label class="consent"><input type="checkbox" name="consent" required> <span>I'm 13 or over and happy to get emails from Covertrex about drops and news. Unsubscribe any time. <a href="/privacy/">Privacy notice</a></span></label>

    </form>

<script>
/* Klaviyo sign-up. Fill in these two values from your Klaviyo account:
   KLAVIYO_COMPANY_ID = your 6-character Public API Key (Settings > Account > API keys)
   KLAVIYO_LIST_ID    = the ID of your sign-up list (Audience > Lists & segments > list > Settings) */
const KLAVIYO_COMPANY_ID = "R7xf9t";
const KLAVIYO_LIST_ID = "STJCuW";

(function () {
  const form = document.getElementById('signup');
  const msg = document.getElementById('signup-msg');
  const btn = form.querySelector('button');
  const say = (text, isErr) => { msg.textContent = text; msg.classList.toggle('err', !!isErr); };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    if (form.website.value) return; // bot filled the hidden field
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say('Please enter a valid email address.', true);
    if (!form.consent.checked) return say('Please tick the box to agree to emails.', true);
    if (!KLAVIYO_COMPANY_ID || !KLAVIYO_LIST_ID) return say('Sign-up opens soon. Check back shortly.', true);

    btn.disabled = true; say('');
    try {
      const res = await fetch('https://a.klaviyo.com/client/subscriptions/?company_id=' + encodeURIComponent(KLAVIYO_COMPANY_ID), {
        method: 'POST',
        headers: { 'content-type': 'application/vnd.api+json', 'revision': '2024-10-15' },
        body: JSON.stringify({ data: {
          type: 'subscription',
          attributes: {
            custom_source: 'Holding page',
            profile: { data: { type: 'profile', attributes: { email } } }
          },
          relationships: { list: { data: { type: 'list', id: KLAVIYO_LIST_ID } } }
        } })
      });
      if (!res.ok) {
        let detail = '';
        try { const j = await res.json(); detail = (j.errors && j.errors[0] && (j.errors[0].detail || j.errors[0].title)) || ''; } catch (_) {}
        console.error('Klaviyo sign-up failed', res.status, detail);
        say('Sign-up failed (' + res.status + (detail ? ': ' + detail : '') + '). Please try again.', true);
        return;
      }
      form.classList.add('done');
      say("You're on the list. Check your inbox.");
    } catch (err) {
      console.error('Klaviyo sign-up could not connect', err);
      say("Couldn't reach the sign-up service. Check your connection and try again.", true);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
